name: CloudKitchen checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudkitchen-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix cloudkitchen-frontend
      - run: npm run build:prod --prefix cloudkitchen-frontend
